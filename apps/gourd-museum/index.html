<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ede7dd"><title>葫芦数字博物馆 · 互动展厅</title><link rel="stylesheet" href="museum.css?v=20260910photo"><script src="../../three.min.js" defer></script><script src="../../OrbitControls.js" defer></script><script src="model.js?v=20260910photo" defer></script><script src="tour-scene.js?v=9b2f49ef40cd" defer></script><script src="museum.js?v=20260910photo" defer></script></head>
<body>
<header class="museum-header"><div class="brand"><span class="seal" aria-hidden="true">葫</span><div><p>GOURD GALLERY</p><h1>葫芦数字博物馆</h1></div><span class="demo-tag">互动展厅</span></div><div class="header-actions"><button id="undo" disabled>撤销</button><button id="reset">恢复示例</button><button id="save" class="solid">保存展厅</button></div></header>
<main class="museum-layout">
 <section class="room" aria-label="三维展厅"><div class="room-label"><span>从真实展柜出发，自由布置一座数字展厅。</span><small><b id="exhibit-count">24</b> / 36 件在展</small></div><canvas id="gallery" tabindex="0" aria-label="三维葫芦展厅，拖动旋转，滚轮缩放；也可使用下方视角按钮和右侧展位选择"></canvas><div id="fallback" hidden><img src="../../images/gourd-museum-display-hd.png" alt="三组木质展柜陈列葫芦藏品"><p>当前设备未能打开三维画面，可以查看展柜原型图片。</p><button id="retry">重新打开</button></div><div class="view-tools" aria-label="展厅视角"><button id="turn-left" aria-label="向左转动视角">↶</button><button id="view-front">正面</button><button id="turn-right" aria-label="向右转动视角">↷</button><span></span><button id="zoom-in" aria-label="放大展厅">＋</button><button id="zoom-out" aria-label="缩小展厅">−</button></div><p class="room-tip">拖动看展厅 · 滚轮缩放 · 点击葫芦查看</p></section>
 <aside class="curator-panel" aria-label="布展工具">
  <section><p class="eyebrow">01 / FURNITURE</p><h2>给展厅换一身气质</h2><div id="skins" class="skins" role="group" aria-label="家具皮肤"></div></section>
  <section class="arrange"><p class="eyebrow">02 / COLLECTION</p><h2>选一件，放进展柜</h2><p class="panel-hint">选择展位，再从下方挑选葫芦。</p><div class="field-row"><label for="cabinet">展柜</label><select id="cabinet"><option value="0">左侧展柜</option><option value="1">中央展柜</option><option value="2">右侧展柜</option></select></div><div id="slots" class="slots" role="group" aria-label="选择展位"></div><div id="selection" class="selection" aria-live="polite"></div><div class="selection-actions"><button id="remove">移回藏品库</button></div><div id="collection" class="collection" role="group" aria-label="选择要上架的示例葫芦"></div><small class="sample-note">首件蜜金葫芦取形自真实展柜照片，其余造型用于体验自由布展。</small></section>
  <section class="wall-options"><p class="eyebrow">03 / ATMOSPHERE</p><div class="field-row"><label for="wall">墙面</label><select id="wall"><option value="warm">米白暖墙</option><option value="sage">青灰素墙</option><option value="ink">墨绿展墙</option></select></div></section>
 </aside>
</main><footer><span>以真实展柜与藏品照片为原型的互动展厅</span><span id="save-state">可保存当前陈列到本机</span></footer><div id="toast" role="status" aria-live="polite"></div>
</body></html>
